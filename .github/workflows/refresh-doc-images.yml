name: Refresh documentation images

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare smoke-test browser
        run: |
          set -o pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -n "$chrome_path" ]]; then
            echo "Using preinstalled Chrome: $chrome_path"
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"
          else
            npm run smoke:install
          fi

      - name: Refresh documentation images
        run: npm run screenshots:refresh
        env:
          SMOKE_IMAGE_DIR: docs/images

      - name: Upload refreshed documentation images
        uses: actions/upload-artifact@v4
        with:
          name: documentation-images
          path: docs/images
          if-no-files-found: error
          retention-days: 14
