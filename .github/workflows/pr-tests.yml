name: Pull request tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare artifact directory
        run: mkdir -p artifacts/ci

      - name: Run typecheck
        id: typecheck
        continue-on-error: true
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee artifacts/ci/typecheck.log

      - name: Run unit tests
        id: unit_tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee artifacts/ci/unit-tests.log

      - name: Prepare smoke-test browser
        id: smoke_install
        run: |
          set -o pipefail
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [[ -n "$chrome_path" ]]; then
            echo "Using preinstalled Chrome: $chrome_path" | tee artifacts/ci/smoke-install.log
            echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$chrome_path" >> "$GITHUB_ENV"
          else
            npm run smoke:install 2>&1 | tee artifacts/ci/smoke-install.log
          fi

      - name: Run webview smoke test and refresh documentation images
        id: smoke_test
        continue-on-error: true
        if: steps.smoke_install.outcome == 'success'
        run: |
          set -o pipefail
          SMOKE_IMAGE_DIR=docs/images npm run screenshots:refresh 2>&1 | tee artifacts/ci/smoke-test.log

      - name: Upload test and smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-test-results
          path: |
            artifacts/ci
            artifacts/webview-smoke.png
            docs/images
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if a check failed
        if: steps.typecheck.outcome == 'failure' || steps.unit_tests.outcome == 'failure' || steps.smoke_test.outcome == 'failure'
        env:
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          UNIT_TESTS_OUTCOME: ${{ steps.unit_tests.outcome }}
          SMOKE_TEST_OUTCOME: ${{ steps.smoke_test.outcome }}
        run: |
          echo "::error::Checks failed: typecheck=${TYPECHECK_OUTCOME}, unit_tests=${UNIT_TESTS_OUTCOME}, smoke_test=${SMOKE_TEST_OUTCOME}"
          exit 1
